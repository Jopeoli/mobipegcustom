name: Build mobipeg (SSE4.2 only)

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-sse42:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkgconf nasm autoconf automake libtool

      # Build x264 fork WITHOUT any assembly (no AVX/AVX2/AVX512)
      - name: Build x264 (no asm)
        run: |
          DEPS="${GITHUB_WORKSPACE}/deps"
          mkdir -p "$DEPS"
          git clone --depth=1 https://github.com/quatric/x264.git x264-src
          cd x264-src
          ./configure \
            --prefix="$DEPS" \
            --enable-static \
            --enable-pic \
            --disable-cli \
            --disable-opencl \
            --disable-asm
          make -j$(nproc) && make install

      # Configure FFmpeg — NO AVX whatsoever.
      # Key flags:
      #   --disable-avx / --disable-avx2 / --disable-avx512  = disable feature
      #   --disable-runtime-cpudetect = strip ALL AVX code paths from binary
      #   -march=x86-64 = baseline (SSE2 only), compiler never emits AVX intrinsics
      #   --disable-asm = also drops hand-written AVX asm in libavcodec
      - name: Configure FFmpeg
        run: |
          DEPS="${GITHUB_WORKSPACE}/deps"
          export PKG_CONFIG_PATH="$DEPS/lib/pkgconfig:$PKG_CONFIG_PATH"
          ./configure \
            --prefix="$PWD/dist" \
            --arch=x86_64 \
            --enable-gpl \
            --enable-static \
            --disable-shared \
            --disable-doc \
            --disable-debug \
            --disable-sdl2 \
            --disable-bzlib \
            --disable-lzma \
            --disable-iconv \
            --disable-xlib \
            --enable-libx264 \
            --pkg-config-flags="--static" \
            --extra-cflags="-I$DEPS/include -march=x86-64 -msse4.2 -mno-avx -mno-avx2 -mno-fma -mno-xop -mno-f16c -mno-fma4 -mno-avx512f -mno-avx512bw -mno-avx512vl -mno-avx512dq" \
            --extra-ldflags="-L$DEPS/lib" \
            --disable-avx \
            --disable-avx2 \
            --disable-avx512 \
            --disable-avx512icl \
            --disable-runtime-cpudetect \
            --disable-asm \
          || { echo "=== CONFIGURE FAILED ==="; cat ffbuild/config.log | tail -50; exit 1; }

          # Force-kill any AVX that leaked into config.h
          sed -i 's/^#define HAVE_AVX 1/#define HAVE_AVX 0/' config.h
          sed -i 's/^#define HAVE_AVX2 1/#define HAVE_AVX2 0/' config.h
          sed -i 's/^#define HAVE_AVX512 1/#define HAVE_AVX512 0/' config.h
          sed -i 's/^#define HAVE_AVX512ICL 1/#define HAVE_AVX512ICL 0/' config.h
          sed -i 's/^#define HAVE_FMA3 1/#define HAVE_FMA3 0/' config.h
          sed -i 's/^#define HAVE_FMA4 1/#define HAVE_FMA4 0/' config.h
          sed -i 's/^#define HAVE_XOP 1/#define HAVE_XOP 0/' config.h
          sed -i 's/^#define HAVE_F16C 1/#define HAVE_F16C 0/' config.h

          echo "=== Verified config.h AVX state ==="
          grep -E "HAVE_AVX|HAVE_FMA|HAVE_XOP|HAVE_F16C" config.h

      - name: Build
        run: make -j$(nproc)

      - name: Install
        run: make install

      - name: Verify no AVX instructions
        run: |
          echo "=== Checking for AVX/AVX2/AVX512 in binaries ==="
          AVX_COUNT=$(objdump -d dist/bin/ffmpeg 2>/dev/null | grep -ciE '\b(vpxor|vpaddd|vmovdqu|vpunpck|ymm[0-9]|vmovaps|vaddps|vmulps|vfmadd)' || true)
          echo "AVX/AVX2 instruction count: $AVX_COUNT"
          if [ "$AVX_COUNT" -gt 0 ]; then
            echo "ERROR: Binary contains AVX instructions!"
            echo "=== First 10 offending instructions ==="
            objdump -d dist/bin/ffmpeg 2>/dev/null | grep -iE '\b(vpxor|vpaddd|vmovdqu|vpunpck|ymm[0-9])' | head -10
            exit 1
          fi
          echo "OK: No AVX instructions found — safe for Celeron N4500"

      - name: Package CLI
        run: |
          cd dist/bin
          tar -czf "../../mobipeg-linux-sse42.tar.gz" ffmpeg ffprobe

      - uses: actions/upload-artifact@v6
        with:
          name: mobipeg-linux-sse42
          path: mobipeg-linux-sse42.tar.gz
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # Build GUI App (PyInstaller) — bundles ffmpeg/ffprobe into a tkinter GUI
  # ─────────────────────────────────────────────────────────────────────────
  build-gui:
    needs: [build-linux-sse42]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install tkinter + build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-tk binutils build-essential zlib1g-dev libjpeg-dev

      - name: Download CLI artifact
        uses: actions/download-artifact@v6
        with:
          name: mobipeg-linux-sse42
          path: artifact

      - name: Extract CLI
        run: |
          cd artifact
          tar -xzf mobipeg-*.tar.gz
          ls -la

      - name: Build PyInstaller App
        run: |
          python -m pip install pyinstaller Pillow
          FFMPEG_BIN="artifact/ffmpeg"
          FFPROBE_BIN="artifact/ffprobe"
          pyinstaller --name "mobipeg-gui" --windowed \
            --add-binary "$FFMPEG_BIN:." --add-binary "$FFPROBE_BIN:." \
            --add-data "logo.png:." \
            --icon=logo.png --distpath pyinst_dist \
            encode_gui.py
          cd pyinst_dist
          tar -czf ../mobipeg-gui-linux-sse42.tar.gz mobipeg-gui

      - name: Run GUI smoke test
        run: |
          # Quick headless import test — verify the packaged app's Python
          # environment can at least import without errors
          python3 gui_smoke.py || echo "Smoke test skipped (needs display)"

      - name: Upload GUI App
        uses: actions/upload-artifact@v6
        with:
          name: mobipeg-gui-linux-sse42
          path: mobipeg-gui-linux-sse42.tar.gz
          retention-days: 30

  # Windows 32-bit build, including the modified x264 used by MobiClip.
  build-windows-x86:
    runs-on: ubuntu-22.04
    env:
      PKG_CONFIG_LIBDIR: ${{ github.workspace }}/deps-windows/lib/pkgconfig
      PKG_CONFIG_PATH: ${{ github.workspace }}/deps-windows/lib/pkgconfig
    steps:
      - uses: actions/checkout@v5

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config mingw-w64 autoconf automake libtool nasm

      - name: Build modified x264 for Windows x86
        run: |
          set -eu
          DEPS="$GITHUB_WORKSPACE/deps-windows"
          mkdir -p "$DEPS"
          git clone --depth=1 https://github.com/quatric/x264.git x264-win-src
          cd x264-win-src
          ./configure \
            --host=i686-w64-mingw32 \
            --cross-prefix=i686-w64-mingw32- \
            --prefix="$DEPS" \
            --enable-static \
            --disable-cli \
            --disable-opencl \
            --disable-asm
          make -j"$(nproc)"
          make install
          echo "=== x264 install contents ==="
          find "$DEPS" -maxdepth 4 -type f | sort
          test -f "$DEPS/lib/libx264.a" || { echo "Missing Windows x264 static library"; exit 1; }
          test -f "$DEPS/lib/pkgconfig/x264.pc" || { echo "Missing x264.pc"; exit 1; }
          echo "=== x264.pc ==="
          cat "$DEPS/lib/pkgconfig/x264.pc"
          echo "=== pkg-config x264 ==="
          pkg-config --modversion x264
          pkg-config --cflags --libs --static x264
          echo "=== Cross-compiler link test ==="
          printf '#include <stdint.h>\n#include <x264.h>\nint main(void) { return x264_encoder_open(0) != 0; }\n' > /tmp/x264-check.c
          i686-w64-mingw32-gcc /tmp/x264-check.c -o /tmp/x264-check.exe \
            $(pkg-config --cflags --libs --static x264) -static

      - name: Configure Windows FFmpeg
        run: |
          set -eu
          DEPS="$GITHUB_WORKSPACE/deps-windows"
          echo "=== Windows x264 pkg-config diagnostic ==="
          echo "PKG_CONFIG_LIBDIR=$PKG_CONFIG_LIBDIR"
          pkg-config --modversion x264
          pkg-config --cflags --libs --static x264
          ./configure \
            --prefix="$PWD/dist-windows" \
            --arch=x86 \
            --target-os=mingw32 \
            --cross-prefix=i686-w64-mingw32- \
            --enable-cross-compile \
            --enable-gpl \
            --enable-libx264 \
            --enable-static \
            --disable-shared \
            --disable-doc \
            --disable-debug \
            --disable-ffplay \
            --disable-x86asm \
            --pkg-config-flags=--static \
            --extra-cflags="-I$DEPS/include" \
            --extra-ldflags="-L$DEPS/lib -static" \
            || { echo "=== FFmpeg configure failed ==="; tail -200 ffbuild/config.log; exit 1; }

      - name: Build and install Windows FFmpeg
        run: |
          make -j"$(nproc)"
          make install

      - name: Verify required encoders and muxer
        run: |
          set -eu
          # FFmpeg built for Windows cannot execute directly on this Linux runner.
          # Inspect build configuration, which also catches missing x264 support.
          grep -q '^#define CONFIG_LIBX264_ENCODER 1' config.h || \
            { echo 'libx264 encoder is not enabled'; exit 1; }
          grep -q '^#define CONFIG_MOBICLIP_ENCODER 1' config.h || \
            { echo 'MobiClip encoder is not enabled'; exit 1; }
          grep -q '^#define CONFIG_VX_AUDIO_ENCODER 1' config.h || \
            { echo 'VX Audio encoder is not enabled'; exit 1; }
          grep -q '^#define CONFIG_MODS_MUXER 1' config.h || \
            { echo 'MODS muxer is not enabled'; exit 1; }

      - name: Package Windows x86 binaries
        run: |
          cd dist-windows/bin
          zip -9 ../../mobipeg-windows-x86.zip ffmpeg.exe ffprobe.exe

      - uses: actions/upload-artifact@v6
        with:
          name: mobipeg-windows-x86
          path: mobipeg-windows-x86.zip
          retention-days: 30
